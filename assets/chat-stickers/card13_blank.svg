    <linearGradient id="c13Gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0c4"/>
      <stop offset="100%" stop-color="#b98a3b"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#c13Glow)"/>
  <g transform="translate(100, 96) rotate(-7)">
