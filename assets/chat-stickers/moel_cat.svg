  <circle cx="100" cy="136" r="7" fill="#f6d884" stroke="#7d5c24" stroke-width="1.4"/>
  <text x="100" y="186" text-anchor="middle" fill="#f6dfb0" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="2.5">MOEL · 1%</text>
</svg>
