<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Moel 黑猫贴纸">
  <defs>
    <radialGradient id="moelHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#e9c878" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1a1230" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moelFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2444"/>
      <stop offset="100%" stop-color="#110d1e"/>
