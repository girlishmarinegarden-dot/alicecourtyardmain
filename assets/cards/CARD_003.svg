<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" role="img" aria-label="CARD_003 水母馆：折痕里的约定">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#08132b"/>
      <stop offset="52%" stop-color="#0e2246"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="38%" r="45%">
