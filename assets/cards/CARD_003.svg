  <text x="210" y="492" text-anchor="middle" fill="#f9f2e4" font-family="'Noto Serif SC', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2">水母馆：折痕里的约定</text>
  <text x="210" y="520" text-anchor="middle" fill="#a8bedd" font-family="Georgia, serif" font-size="11.5" letter-spacing="2.2">THE CREASED TICKET · GLASS ABYSS</text>
  <text x="210" y="556" text-anchor="middle" fill="#d4af68" font-family="Georgia, serif" font-size="11" letter-spacing="3" opacity="0.85">CARD_003 · ALICE'S GARDEN</text>
