      <stop offset="55%" stop-color="#3c6ef0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#08132b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0a8"/>
      <stop offset="50%" stop-color="#d4af68"/>
      <stop offset="100%" stop-color="#8b6b34"/>
    </linearGradient>
    <linearGradient id="bell3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f8ff" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#75c7ff" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#3b5bd9" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="420" height="600" rx="22" fill="url(#bg3)"/>
  <rect width="420" height="600" rx="22" fill="url(#glow3)"/>
  <!-- Outer filigree frame -->
  <rect x="14" y="14" width="392" height="572" rx="16" fill="none" stroke="url(#gold3)" stroke-width="2" opacity="0.88"/>
  <rect x="24" y="24" width="372" height="552" rx="11" fill="none" stroke="#e8cf95" stroke-width="0.9" opacity="0.45" stroke-dasharray="4 4"/>
  <!-- Corner diamonds -->
  <g fill="#f0d598" opacity="0.85">
