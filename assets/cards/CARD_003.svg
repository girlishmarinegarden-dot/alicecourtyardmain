  <rect x="330" y="38" width="48" height="22" rx="11" fill="rgba(212,175,104,0.16)" stroke="url(#gold3)" stroke-width="1"/>
  <text x="354" y="53" text-anchor="middle" fill="#f7e3b2" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5">SSR</text>
