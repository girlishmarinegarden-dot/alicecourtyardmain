<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f1" />
  <meta name="description" content="爱丽丝庭院 TCG 官方商品目录与公告：实时同步货架、高清缩放与一键询单清单。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="商品目录 · Product Catalog | 爱丽丝庭院 TCG" />
  <meta property="og:description" content="实时同步卡牌与周边货架，支持搜索筛选、高清缩放与一键询单。" />
  <meta property="og:image" content="assets/alicecore.webp" />
  <title>Product Catalog | 爱丽丝庭院 TCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="news.css" />
</head>
<body>
  <!-- Sticky Mobile-First Topbar -->
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <a href="index.html" class="btn btn--ghost topbar__home" title="返回爱丽丝庭院主页" aria-label="返回爱丽丝庭院主页">← 庭院</a>
        <div class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </div>
        <div class="brand__text">
          <h1 class="brand__title" id="brand-title">Catalog</h1>
          <p class="brand__status" id="status" aria-live="polite">Loading catalog…</p>
        </div>
      </div>

      <div class="topbar__actions">
        <button type="button" id="unlock-toggle-btn" class="btn btn--lock" hidden>
          <span class="btn__icon" aria-hidden="true">🔒</span>
          <span id="unlock-toggle-label">VIP</span>
        </button>

        <button type="button" id="lang-toggle-btn" class="btn btn--icon btn--lang" title="Switch Language / 切换语言" aria-label="Switch language">
          中文
        </button>

        <button type="button" id="refresh-btn" class="btn btn--icon" title="Refresh catalog" aria-label="Refresh catalog">
          <svg class="icon-refresh" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
        </button>

        <button type="button" id="theme-toggle-btn" class="btn btn--icon" title="Toggle light / dark theme" aria-label="Toggle theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Collapsible Password Drawer -->
    <div id="unlock-panel" class="unlock-drawer" hidden>
      <div class="container unlock-drawer__inner">
        <div class="unlock-drawer__info">
          <span class="unlock-drawer__badge" id="unlock-badge">VIP Area</span>
          <span class="unlock-drawer__hint" id="unlock-hint">Enter password to unlock private items (this session only).</span>
        </div>
        <div class="unlock-drawer__form">
          <input
            type="password"
            id="unlock-pw"
            class="input unlock-input"
            maxlength="64"
            autocomplete="off"
            placeholder="Enter password…"
            aria-label="Password"
          />
          <button type="button" id="unlock-btn" class="btn btn--primary">Unlock</button>
          <button type="button" id="unlock-close-btn" class="btn btn--ghost">Close</button>
        </div>
        <span id="unlock-err" class="unlock-err" role="alert" aria-live="polite"></span>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <!-- Error Banner -->
    <div id="error" class="alert-error" role="alert" hidden></div>

    <!-- New Arrivals Horizontal Swipe Rail -->
    <section class="latest-section" id="latest-section" hidden aria-label="New Arrivals">
      <div class="section-head">
        <div class="section-head__title">
          <span class="live-dot" aria-hidden="true"></span>
          <h2 id="latest-heading">New Arrivals</h2>
          <span class="section-head__sub" id="latest-sub">Tap to zoom</span>
        </div>
        <div class="section-head__nav">
          <button type="button" id="latest-prev" class="circle-btn" aria-label="Scroll left">‹</button>
          <button type="button" id="latest-next" class="circle-btn" aria-label="Scroll right">›</button>
        </div>
      </div>
      <div class="latest-track" id="latest-track"></div>
    </section>

    <!-- Mobile-First Search, Swipeable Tags & Compact Controls -->
    <section class="toolbar" aria-label="Search and filter">
      <div class="toolbar__search-row">
        <div class="search-box">
          <svg class="search-box__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            type="search"
            id="find-input"
            class="search-box__input"
            placeholder="Search items, series, or date…"
            autocomplete="off"
            aria-label="Search catalog"
          />
          <button type="button" id="find-clear" class="search-box__clear" hidden aria-label="Clear search">✕</button>
        </div>

        <!-- View Mode Switcher: 2-Col Grid / 1-Col Large / List -->
        <div class="view-switch" role="group" aria-label="View mode">
          <button type="button" id="view-grid-btn" class="view-switch__btn is-active" title="Grid view" aria-label="Grid view" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
          </button>
          <button type="button" id="view-large-btn" class="view-switch__btn view-switch__btn--mobile" title="Large single-column view" aria-label="Large view" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M3 15h18"></path>
            </svg>
          </button>
          <button type="button" id="view-list-btn" class="view-switch__btn" title="List view" aria-label="List view" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Horizontal Swipeable Category Pills -->
      <div class="tag-bar" id="tag-bar" role="group" aria-label="Quick series filter"></div>

      <!-- Compact Meta & Controls Row -->
      <div class="toolbar__controls-row">
        <div class="result-meta" id="find-count" aria-live="polite"></div>

        <div class="toolbar__controls">
          <label class="toggle-chip" id="hide-locked-wrap" hidden>
            <input type="checkbox" id="hide-locked-toggle" checked />
            <span id="hide-locked-label">Public only</span>
          </label>

          <select id="sort-select" class="select" aria-label="Sort order">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>

          <select id="pagesize-select" class="select" aria-label="Items per page">
            <option value="20" selected>20 / page</option>
            <option value="40">40 / page</option>
            <option value="9999">Show all</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Main Catalog Feed -->
    <section id="feed" class="catalog catalog--grid" aria-label="Product list"></section>

    <!-- Pagination -->
    <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
      <div class="pagination__info" id="page-range"></div>
      <div class="pagination__controls">
        <button type="button" id="page-prev" class="btn btn--ghost">‹ Prev</button>
        <div class="pagination__pages" id="page-numbers"></div>
        <span class="pagination__mobile-indicator" id="page-mobile-info"></span>
        <button type="button" id="page-next" class="btn btn--ghost">Next ›</button>
      </div>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span id="footer-tip">Tap any photo for HD zoom · Tap ＋ to build an inquiry list</span>
    </div>
  </footer>

  <!-- Mobile-Friendly Floating Selection Bar -->
  <aside id="selection-bar" class="selection-bar" hidden aria-label="Selected items">
    <div class="selection-bar__inner">
      <div class="selection-bar__left">
        <span class="selection-bar__count" id="selection-count">0 selected</span>
        <div class="selection-bar__thumbs" id="selection-thumbs"></div>
      </div>
      <div class="selection-bar__actions">
        <button type="button" id="selection-view-btn" class="btn btn--ghost btn--sm">View</button>
        <button type="button" id="selection-wa-btn" class="btn btn--primary btn--sm" title="Send selected items via WhatsApp">WhatsApp</button>
        <button type="button" id="selection-copy-btn" class="btn btn--ghost btn--sm">Copy</button>
        <button type="button" id="selection-clear-btn" class="btn btn--ghost btn--sm" aria-label="Clear selection">✕</button>
      </div>
    </div>
  </aside>

  <!-- Full-Screen HD Lightbox (Touch Swipe & Zoom) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <div class="lightbox__backdrop" data-lb-close></div>
    <div class="lightbox__container">
      <div class="lightbox__top">
        <span class="lightbox__counter" id="lb-counter"></span>
        <div class="lightbox__top-actions">
          <button type="button" id="lb-zoom-btn" class="lb-icon-btn">🔍 Zoom</button>
          <button type="button" id="lb-close-btn" class="lb-icon-btn lb-icon-btn--close" aria-label="Close">✕</button>
        </div>
      </div>

      <div class="lightbox__stage" id="lb-stage">
        <button type="button" id="lb-prev-btn" class="lb-nav lb-nav--prev" aria-label="Previous item">‹</button>
        <div class="lightbox__media" id="lb-media">
          <div class="lightbox__spinner" id="lb-spinner" aria-hidden="true"></div>
          <img id="lb-img" class="lightbox__img" src="" alt="" referrerpolicy="no-referrer" />
        </div>
        <button type="button" id="lb-next-btn" class="lb-nav lb-nav--next" aria-label="Next item">›</button>
      </div>

      <div class="lightbox__bottom">
        <div class="lightbox__meta">
          <div class="lightbox__title-row">
            <span id="lb-new-badge" class="badge-new" hidden>NEW</span>
            <h3 class="lightbox__title" id="lb-title"></h3>
          </div>
          <p class="lightbox__time" id="lb-time"></p>
        </div>
        <div class="lightbox__actions">
          <button type="button" id="lb-select-btn" class="btn btn--ghost btn--sm">＋ Select</button>
          <button type="button" id="lb-copy-btn" class="btn btn--ghost btn--sm">Copy</button>
          <a id="lb-drive-link" class="btn btn--primary btn--sm" href="#" target="_blank" rel="noopener">Original ↗</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Selected Inquiry List Modal -->
  <div id="selection-modal" class="modal" role="dialog" aria-modal="true" aria-label="Selected inquiry list" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog">
      <div class="modal__header">
        <h2 class="modal__title">
          <span id="modal-title-text">Selected Items</span>
          <span id="modal-sel-count" class="modal__badge">0</span>
        </h2>
        <button type="button" class="lb-icon-btn lb-icon-btn--close" data-modal-close aria-label="Close">✕</button>
      </div>
      <div class="modal__body" id="selection-modal-list"></div>
      <div class="modal__footer">
        <button type="button" id="modal-clear-btn" class="btn btn--ghost">Clear All</button>
        <button type="button" id="modal-copy-btn" class="btn btn--ghost">Copy Inquiry List</button>
        <button type="button" id="modal-wa-btn" class="btn btn--primary">Send via WhatsApp ↗</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="news.js"></script>
</body>
</html>
